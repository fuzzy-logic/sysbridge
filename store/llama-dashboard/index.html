<!--
  Llama Dashboard — what is my llama-server router doing right now?

  One file. No build, no dependencies. A sysbridge store app (store/llama-dashboard/):
  install it from the App Store; served at http://llama-dashboard.localhost/ and it
  talks to exactly one thing, the bridge on its own origin (opened from file://
  it uses http://localhost).
  The llama-servers are the bridge's upstreams (SYSBRIDGE_LLAMA_SERVERS,
  default router :8080 + reviewer :8127) and arrive as probes:

    llama          health, mode, props, models per server      (2 s)
    llama_slots    /slots per loaded model — who is generating (1 s)
    gpu ram cpu disk battery rocm_pids router_models            (system panel)

  Load/Unload go through POST /v1/llama/<server>/load|unload with the shared
  bridge token, behind a dialog that states what gets evicted.

  Footguns this page is built around (verified 2026-09-22, build b1-c26c2ea):
    * /props?model=<unloaded> LOADS that model — the bridge sends autoload=false
      on every router GET, so no page can trigger it by accident.
    * Under --models-max 1, load evicts the resident model. The confirm says so.
    * DELETE /models removes a model from the router and breaks every client
      that names it. Neither this page nor the bridge offers it.
    * gpu_busy_percent reads 100% whenever a model is merely resident on this
      APU. Activity (/slots) is the real signal; busy% carries that caveat.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llama Dashboard</title>
<meta name="description" content="What the llama-server router is doing right now: resident model, who is generating, GPU memory per process. Talks only to the bridge.">
<meta name="app-icon" content="🦙">
<meta name="app-version" content="1.0">
<meta name="app-author" content="sysbridge">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --fg: #1c1f24; --muted: #6b7280; --card: #ffffff; --line: #e3e6ea;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #2563eb; --idle: #9ca3af;
    --bar: #e5e7eb; --accent: #2563eb; --accent2: #7c3aed;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --fg: #e5e7eb; --muted: #9aa3ad; --card: #171b21; --line: #262b33;
            --bar: #262b33; --idle: #4b5563; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 1rem; padding: .6rem 1rem; border-bottom: 1px solid var(--line);
           position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  header .stamp { color: var(--muted); font-size: .85rem; margin-left: auto; }
  header .paused { color: var(--warn); font-weight: 600; }
  main { padding: 1rem; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: .6rem; padding: .8rem 1rem; min-width: 0; }
  section.wide { grid-column: 1 / -1; }
  section h2 { font-size: .95rem; margin: 0 0 .6rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; }
  section h2 .sub { color: var(--muted); font-weight: 400; font-size: .8rem; }
  .cards { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
  .card { border: 1px solid var(--line); border-radius: .5rem; padding: .6rem .8rem; }
  .card .name { font-weight: 600; display: flex; align-items: center; gap: .5rem; }
  .card dl { margin: .4rem 0 0; display: grid; grid-template-columns: auto 1fr; gap: .15rem .8rem; font-size: .85rem; }
  .card dt { color: var(--muted); } .card dd { margin: 0; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }
  .pill { display: inline-block; padding: .05rem .5rem; border-radius: 1rem; font-size: .75rem; font-weight: 600; color: #fff; background: var(--idle); }
  .pill.loaded, .pill.ok, .pill.busy { background: var(--ok); }
  .pill.loading, .pill.downloading, .pill.warn, .pill.stale { background: var(--warn); }
  .pill.failed, .pill.bad { background: var(--bad); }
  .pill.sleeping { background: var(--info); }
  .pill.idle, .pill.unloaded { background: var(--idle); }
  .muted { color: var(--muted); }
  .err { color: var(--bad); font-size: .85rem; margin: .3rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .err:empty { display: none; }
  button { font: inherit; padding: .25rem .7rem; border-radius: .4rem; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  details summary { cursor: pointer; color: var(--muted); font-size: .8rem; }
  pre { font-size: .75rem; margin: .3rem 0 0; padding: .5rem; background: var(--bg); border-radius: .4rem; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bar { position: relative; height: .7rem; background: var(--bar); border-radius: .35rem; overflow: hidden; margin: .15rem 0 .4rem; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
  .bar > i.over { background: var(--accent2); opacity: .85; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem .8rem; font-size: .85rem; }
  .kv b { display: block; font-weight: 500; color: var(--muted); font-size: .75rem; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  dialog { border: 1px solid var(--line); border-radius: .6rem; background: var(--card); color: var(--fg); padding: 1rem 1.2rem; max-width: min(34rem, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 .6rem; font-size: 1rem; }
  dialog label { display: block; margin: .5rem 0 .15rem; font-size: .85rem; color: var(--muted); }
  dialog input { width: 100%; font: inherit; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: .4rem; background: var(--bg); color: var(--fg); }
  dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }
  .consequence { background: var(--bg); border-left: 3px solid var(--warn); padding: .5rem .8rem; border-radius: .3rem; margin: .5rem 0; font-size: .9rem; }
  [hidden] { display: none !important; }
</style>

<header>
  <h1>Llama Dashboard</h1>
  <span id="pausedFlag" class="paused" hidden>paused (tab hidden)</span>
  <span class="stamp">last refreshed <span id="stamp">—</span></span>
  <button id="settingsBtn" title="Endpoints and bridge token">Settings</button>
</header>

<main>
  <section id="serversSec" class="wide">
    <h2>Servers <span class="sub">health · build · slots · mode</span></h2>
    <div class="err" id="serversErr"></div>
    <div id="servers" class="cards"></div>
  </section>

  <section id="modelsSec" class="wide">
    <h2>Router models <span class="sub" id="modelsSub"></span></h2>
    <div class="err" id="modelsErr"></div>
    <div class="tablewrap"><table id="models"></table></div>
  </section>

  <section id="activitySec" class="wide">
    <h2>Activity <span class="sub">/slots via the bridge, 1 s</span></h2>
    <div id="activity" class="cards"></div>
  </section>

  <section id="systemSec" class="wide" hidden>
    <h2>System <span class="sub">via sysbridge <span id="bridgeStamp"></span></span></h2>
    <div class="err" id="systemErr"></div>
    <div id="system"></div>
  </section>
</main>

<dialog id="settingsDlg">
  <h3>Settings</h3>
  <form method="dialog" id="settingsForm">
    <label>Bridge (sysbridge — this page's own origin when served from it)</label><input name="bridge" placeholder="http://localhost">
    <label>Bridge token (needed for Load/Unload; shared with the launcher and other apps; from <code>python -m bridge --token</code>)</label><input name="token" autocomplete="off">
    <label>llama-servers (configured on the bridge: <code>SYSBRIDGE_LLAMA_SERVERS</code>, read-only here)</label>
    <dl id="upstreams" style="display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;font-size:.85rem;margin:.3rem 0"></dl>
    <div class="actions">
      <button type="button" id="settingsReset">Defaults</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDlg">
  <h3 id="confirmTitle"></h3>
  <div id="confirmBody"></div>
  <div class="actions">
    <button type="button" id="confirmNo">Cancel</button>
    <button type="button" id="confirmYes" class="danger">Confirm</button>
  </div>
</dialog>

<script>
'use strict';
// ---------------------------------------------------------------- settings
// This app talks to exactly one thing: the bridge. Served from /apps/llama-dashboard/ that is its own
// origin; opened from file:// it is http://localhost. The llama-servers themselves are the bridge's
// upstreams (SYSBRIDGE_LLAMA_SERVERS) and arrive as the `llama` / `llama_slots` probes.
const SERVED_BY_BRIDGE = location.pathname.startsWith('/apps/') || /\.localhost$/.test(location.hostname);
const DEFAULTS = { bridge: SERVED_BY_BRIDGE ? location.origin : 'http://localhost', token: '' };
const LS_KEY = 'app:llama-dashboard:settings';      // prefixed for the /apps/ fallback, where apps share one origin
const TOKEN_KEY = 'sysbridge.token';            // written by the bridge into this origin's localStorage as it serves the page
let S = loadSettings();
function loadSettings() {
  let s = {}; try { s = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) {}
  let token = ''; try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  return { ...DEFAULTS, ...s, token };
}
function saveSettings(s) {
  S = s;
  try { const { token, ...rest } = s; localStorage.setItem(LS_KEY, JSON.stringify(rest)); localStorage.setItem(TOKEN_KEY, token || ''); } catch (e) {}
}
const trim = u => (u || '').trim().replace(/\/+$/, '');
const tokenNow = () => { try { return localStorage.getItem(TOKEN_KEY) || S.token || ''; } catch (e) { return S.token || ''; } };

// ---------------------------------------------------------------- helpers
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GiB = 1024 ** 3;
const fmtBytes = n => n == null ? '—' : n >= GiB ? (n / GiB).toFixed(1) + ' GiB' : n >= 1024 ** 2 ? (n / 1024 ** 2).toFixed(0) + ' MiB' : n + ' B';
const fmtParams = n => n == null ? '—' : n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : (n / 1e6).toFixed(0) + 'M';
const fmtK = n => n == null ? '—' : n >= 1024 ? (n / 1024).toFixed(0) + 'k' : String(n);
const fmtInt = n => n == null ? '—' : Number(n).toLocaleString();
const fmtF = x => x == null ? '—' : String(+Number(x).toPrecision(3));
const pct = (a, b) => (b > 0 ? Math.min(100, 100 * a / b) : 0);

async function getJSON(url, { timeout = 4000, ...opts } = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { ...opts, signal: ctl.signal, cache: 'no-store' });
    const text = await r.text();
    let body = null; try { body = text ? JSON.parse(text) : null; } catch (e) { body = { raw: text }; }
    if (!r.ok) { const e = new Error(body?.error?.message || body?.error || text || r.statusText); e.status = r.status; throw e; }
    return body;
  } finally { clearTimeout(t); }
}
const errText = e => e?.name === 'AbortError' ? 'timeout' : (e?.message || String(e));

// ---------------------------------------------------------------- state
// One request per tick: /v1/all with every probe this page draws. The bridge caches each probe at
// its own TTL, so asking every second costs a few sysfs reads plus whatever is actually stale.
const PROBES = 'llama,llama_slots,gpu,ram,cpu,disk,battery,rocm_pids,router_models';
const state = { all: null, err: '', busy: false, ts: 0 };
const openDetails = new Set();
let paused = false;

const R = () => state.all?.results || {};
const P = name => { const e = R()[name]; return e && e.data ? e.data : null; };   // data, even when stale
const servers = () => Object.values(P('llama')?.servers || {});
const router = () => servers().find(s => s.mode === 'router') || servers()[0] || null;
const routerModels = () => router()?.models || [];
const bridgeModelInfo = id => (P('router_models')?.models || []).find(m => m.id === id) || null;
const anyLoading = () => routerModels().some(m => ['loading', 'downloading'].includes(m.status?.value));

async function poll() {
  const b = trim(S.bridge);
  if (!b) { state.all = null; state.err = 'no bridge URL set'; renderAll(); return; }
  try { state.all = await getJSON(`${b}/v1/all?names=${PROBES}`, { timeout: 3500 }); state.err = ''; state.ts = Date.now(); }
  catch (e) { state.err = `bridge not answering at ${b}: ${errText(e)}`; }
  renderAll();
}
function renderAll() { renderServers(); renderModels(); renderActivity(); renderSystem(); stamp(); }
const badge = env => env?.stale ? ' <span class="pill stale" title="cached value; the bridge could not refresh it">stale</span>' : '';

// ---------------------------------------------------------------- servers panel
function renderServers() {
  const env = R().llama;
  $('serversErr').textContent = state.err || (env && !env.ok && !env.data ? `llama probe: ${env.error?.message}` : '');
  const list = servers();
  if (!list.length) { $('servers').innerHTML = state.all ? '<div class="muted">the bridge has no llama servers configured (SYSBRIDGE_LLAMA_SERVERS)</div>' : ''; return; }
  $('servers').innerHTML = list.map(sv => {
    const p = sv.props || {};
    const pill = sv.ok ? '<span class="pill ok">healthy</span>' : '<span class="pill bad">down</span>';
    const rows = [
      ['url', esc(sv.url)],
      ['mode', sv.mode === 'router' ? 'router (multi-model)' : sv.mode === 'single' ? 'single model' : '—'],
      ['build', esc(p.build_info || '—')],
      ['slots', p.total_slots ?? '—'],
    ];
    if (sv.mode === 'router') {
      const n = sv.models.length, loaded = sv.models.filter(m => m.status?.value === 'loaded').map(m => m.id);
      rows.push(['presets', n ? `${n} (${loaded.length ? 'loaded: ' + esc(loaded.join(', ')) : 'none loaded'})` : '—']);
    } else if (sv.models[0]) {
      const m = sv.models[0];
      rows.push(['model', esc(p.model_alias || m.id || '—')], ['ctx', fmtK(m.meta?.n_ctx)], ['size', fmtBytes(m.meta?.size)]);
    }
    if (p.is_sleeping) rows.push(['state', '<span class="pill sleeping">sleeping</span>']);
    if (sv.error) rows.push(['error', `<span class="err">${esc(sv.error)}</span>`]);
    return `<div class="card"><div class="name">${esc(sv.name)} ${pill}${badge(env)}</div><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  }).join('');
}

// ---------------------------------------------------------------- models panel
function parsePreset(txt) {
  const o = {}; for (const line of String(txt || '').split('\n')) { const m = line.match(/^\s*([\w.-]+)\s*=\s*(.*?)\s*$/); if (m) o[m[1]] = m[2]; } return o;
}
let modelsSig = '';
function renderModels() {
  const rt = router(); const ms = routerModels();
  $('modelsErr').textContent = state.actErr || '';
  $('modelsSub').textContent = rt ? `${esc(rt.name)} · ${ms.length} presets · via the bridge, 1 s` : '';
  if (!ms.length) { $('models').innerHTML = rt ? '' : '<tr><td class="muted">no router configured</td></tr>'; modelsSig = ''; return; }
  const disabled = state.busy || anyLoading() || !rt.ok;
  // Only touch the DOM when something visible changed: keeps expanders, selections and focus stable.
  const sig = JSON.stringify([disabled, ms.map(m => [m.id, m.status?.value, m.meta?.size, bridgeModelInfo(m.id)?.size_bytes])]);
  if (sig === modelsSig) return;
  modelsSig = sig;
  const head = `<tr><th>model</th><th>status</th><th class="num">size</th><th class="num">params</th><th class="num">ctx</th><th>modalities</th><th>controls</th></tr>`;
  const rows = ms.map(m => {
    const st = m.status?.value || 'unknown'; const meta = m.meta; const preset = parsePreset(m.status?.preset);
    const bi = bridgeModelInfo(m.id);
    const size = meta ? fmtBytes(meta.size) : bi?.size_bytes != null ? `<span class="muted" title="file size on disk${bi.shards > 1 ? `, ${bi.shards} shards` : ''}">${fmtBytes(bi.size_bytes)}</span>` : '<span class="muted">—</span>';
    const params = meta ? fmtParams(meta.n_params) : '<span class="muted">—</span>';
    const ctx = meta ? fmtK(meta.n_ctx) : preset['ctx-size'] ? `<span class="muted" title="from preset">${fmtK(+preset['ctx-size'])}</span>` : '—';
    const mods = (m.architecture?.input_modalities || []).join(', ') || '—';
    const isOpen = openDetails.has(m.id) ? ' open' : '';
    const ctl = st === 'loaded'
      ? `<button data-act="unload" data-id="${esc(m.id)}" ${disabled ? 'disabled' : ''}>Unload</button>`
      : ['unloaded', 'failed', 'sleeping'].includes(st)
        ? `<button data-act="load" data-id="${esc(m.id)}" ${disabled ? 'disabled' : ''}>Load</button>`
        : '<span class="muted">…</span>';
    const details = `<details data-id="${esc(m.id)}"${isOpen}><summary>details</summary>` +
      (bi?.model_path ? `<div class="muted" style="font-size:.75rem;margin-top:.3rem">file: ${esc(bi.model_path)}${bi.shards > 1 ? ` (${bi.shards} shards, ${fmtBytes(bi.size_bytes)} total)` : ''}${bi.mmproj_path ? ' + mmproj ' + fmtBytes(bi.mmproj_size_bytes) : ''}</div>` : '') +
      `<pre>${esc(m.status?.preset || '(no preset)')}</pre>` +
      (m.status?.args?.length ? `<pre>${esc(m.status.args.join(' \\\n  '))}</pre>` : '') + `</details>`;
    return `<tr><td><b>${esc(m.id)}</b>${details}</td><td><span class="pill ${esc(st)}">${esc(st)}</span></td>` +
      `<td class="num">${size}</td><td class="num">${params}</td><td class="num">${ctx}</td><td>${esc(mods)}</td><td>${ctl}</td></tr>`;
  }).join('');
  $('models').innerHTML = head + rows;
}
$('models').addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS') { d.open ? openDetails.add(d.dataset.id) : openDetails.delete(d.dataset.id); } }, true);
$('models').addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b) confirmAction(b.dataset.act, b.dataset.id); });

// ---------------------------------------------------------------- controls (through the bridge, token-gated)
async function confirmAction(act, id) {
  const rt = router(); const m = routerModels().find(x => x.id === id); if (!rt || !m) return;
  const loaded = routerModels().filter(x => x.status?.value === 'loaded' && x.id !== id);
  const bi = bridgeModelInfo(id);
  let title, body;
  if (act === 'load') {
    title = `Load ${id}?`;
    const fileSz = bi?.size_bytes != null ? fmtBytes(bi.size_bytes + (bi.mmproj_size_bytes || 0)) : 'unknown';
    if (loaded.length) {
      const y = loaded[0];
      body = `<div class="consequence">Loading <b>${esc(id)}</b> will <b>evict ${esc(y.id)}</b> — the router keeps one model resident (models-max 1). ` +
        `${esc(y.id)}'s ${fmtBytes(y.meta?.size)} in GPU memory will be freed and ${esc(id)}'s file is ${fileSz}. ` +
        `Every client currently talking to ${esc(y.id)} will wait for a cold reload later (30–120 s).</div>`;
    } else {
      body = `<div class="consequence">Nothing is resident. ${esc(id)}'s file is ${fileSz}; loading takes 30–120 s and clients calling it will queue until it is ready.</div>`;
    }
  } else {
    title = `Unload ${id}?`;
    body = `<div class="consequence">Unloading <b>${esc(id)}</b> frees its ${fmtBytes(m.meta?.size)} of GPU memory. ` +
      `Any client that names it will trigger a cold reload on its next request (30–120 s). The preset stays in the router; nothing is removed.</div>`;
  }
  if (!tokenNow()) body += `<div class="err">No bridge token in this page's storage (the bridge runs with --no-token-inject?). Paste it in Settings.</div>`;
  $('confirmTitle').textContent = title; $('confirmBody').innerHTML = body;
  $('confirmYes').textContent = act === 'load' ? 'Load' : 'Unload';
  const dlg = $('confirmDlg');
  const ok = await new Promise(res => {
    const yes = () => { cleanup(); res(true); }, no = () => { cleanup(); res(false); };
    const cleanup = () => { $('confirmYes').removeEventListener('click', yes); $('confirmNo').removeEventListener('click', no); dlg.removeEventListener('close', no); dlg.close(); };
    $('confirmYes').addEventListener('click', yes); $('confirmNo').addEventListener('click', no); dlg.addEventListener('close', no);
    dlg.showModal();
  });
  if (!ok) return;
  state.busy = true; state.actErr = ''; renderModels();
  try {
    const r = await getJSON(`${trim(S.bridge)}/v1/llama/${encodeURIComponent(rt.name)}/${act}`, {
      method: 'POST', timeout: 30000,
      // read the token at call time so a token pasted in Settings mid-session is picked up
      headers: { 'Content-Type': 'application/json', 'X-Bridge-Token': tokenNow() },
      body: JSON.stringify({ model: id, confirm: true }),
    });
    if (r?.ok !== true) throw new Error(r?.error || 'the router did not report success');
  } catch (e) {
    state.actErr = `${act} ${id} failed — ${e.status === 401 ? 'wrong or missing token (Settings)' : errText(e)}`;
  } finally { state.busy = false; modelsSig = ''; await poll(); }
}

// ---------------------------------------------------------------- activity panel
function renderActivity() {
  const env = R().llama_slots; const data = P('llama_slots');
  const cards = [];
  for (const [name, sv] of Object.entries(data?.servers || {})) {
    for (const [label, entry] of Object.entries(sv.models || {})) {
      if (entry.error) { cards.push(`<div class="card"><div class="name">${esc(label)} <span class="pill bad">error</span></div><div class="err">${esc(entry.error)}</div></div>`); continue; }
      const rows = entry.slots || []; const busy = rows.some(r => r.is_processing);
      const slots = rows.map(r => {
        const nt = Array.isArray(r.next_token) ? r.next_token[0] : r.next_token; const p = r.params || {};
        const kv = [
          ['state', r.is_processing ? '<span class="pill busy">generating</span>' : '<span class="pill idle">idle</span>'],
          ['task', r.id_task ?? '—'],
          ['prompt tokens', `${fmtInt(r.n_prompt_tokens)}${r.n_prompt_tokens_cache ? ` <span class="muted">(${fmtInt(r.n_prompt_tokens_cache)} from cache)</span>` : ''}`],
          ['decoded', fmtInt(nt?.n_decoded)],
          ['ctx', fmtK(r.n_ctx)],
        ];
        if (p.temperature != null) kv.push(['sampling', `T ${fmtF(p.temperature)} · top_k ${p.top_k} · top_p ${fmtF(p.top_p)} · min_p ${fmtF(p.min_p)} · max ${fmtInt(p.max_tokens)}`]);
        if (p['speculative.types'] && p['speculative.types'] !== 'none') kv.push(['speculative', esc(p['speculative.types'])]);
        if (p.reasoning_format) kv.push(['reasoning', esc(p.reasoning_format)]);
        return `<dl><dt>slot</dt><dd>${r.id}</dd>${kv.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
      }).join('');
      cards.push(`<div class="card"><div class="name">${esc(label)} ${busy ? '<span class="pill busy">busy</span>' : '<span class="pill idle">idle</span>'}${badge(env)} <span class="muted" style="font-weight:400;font-size:.8rem">${esc(name)} · ${rows.length} slot${rows.length === 1 ? '' : 's'}</span></div>${slots}</div>`);
    }
  }
  $('activity').innerHTML = cards.join('') || '<div class="muted">no loaded model to watch</div>';
}

// ---------------------------------------------------------------- system panel
function bar(used, total, over) {
  const w = pct(used, total).toFixed(1);
  const o = over != null ? `<i class="over" style="width:${pct(over, total).toFixed(1)}%"></i>` : '';
  return `<div class="bar">${o}<i style="width:${w}%"></i></div>`;
}
function renderSystem() {
  const sec = $('systemSec');
  const gpu = P('gpu'), ram = P('ram'), cpu = P('cpu');
  if (!state.all || (!gpu && !ram && !cpu)) { sec.hidden = true; return; }
  sec.hidden = false;
  const Rr = R();
  $('bridgeStamp').textContent = '· ' + new Date((state.all.ts || 0) * 1000).toLocaleTimeString();
  $('systemErr').textContent = ['gpu', 'ram', 'cpu', 'disk', 'battery', 'rocm_pids'].filter(n => Rr[n] && !Rr[n].ok && !Rr[n].data).map(n => `${n}: ${Rr[n].error?.message}`).join('\n');
  const out = [];
  let h = `<div class="kv">`;
  if (gpu?.gtt) h += `<div><b>GTT (GPU-accessible system RAM)${badge(Rr.gpu)}</b>${fmtBytes(gpu.gtt.used)} / ${fmtBytes(gpu.gtt.total)}${bar(gpu.gtt.used, gpu.gtt.total)}</div>`;
  if (gpu?.vram) h += `<div><b>VRAM (carve-out)</b>${fmtBytes(gpu.vram.used)} / ${fmtBytes(gpu.vram.total)}${bar(gpu.vram.used, gpu.vram.total)}</div>`;
  if (ram) {
    const u = ram.unified || {};
    h += `<div><b>RAM${badge(Rr.ram)} <span title="the purple share is GTT — GPU memory carved from the same RAM">(GTT overlaid)</span></b>${fmtBytes(ram.used)} used / ${fmtBytes(ram.total)} · ${fmtBytes(ram.available)} available${bar(ram.used, ram.total, u.gtt_used)}</div>`;
    if (ram.swap?.total) h += `<div><b>swap</b>${fmtBytes(ram.swap.total - ram.swap.free)} / ${fmtBytes(ram.swap.total)}${bar(ram.swap.total - ram.swap.free, ram.swap.total)}</div>`;
  }
  h += `</div><div class="kv" style="margin-top:.5rem">`;
  if (gpu) {
    h += `<div><b>GPU busy <span title="on this APU busy% reads 100 whenever a model is resident; use Activity for real work">ⓘ</span></b>${gpu.busy_percent ?? '—'} %</div>`;
    h += `<div><b>GPU temp</b>${gpu.temp_c != null ? gpu.temp_c.toFixed(0) + ' °C' : '—'}</div>`;
    h += `<div><b>GPU power</b>${gpu.power_w != null ? gpu.power_w.toFixed(1) + ' W' : '—'}</div>`;
    h += `<div><b>GPU clock</b>${gpu.sclk_mhz != null ? gpu.sclk_mhz + ' MHz' : '—'}</div>`;
  }
  if (cpu) {
    h += `<div><b>CPU busy${badge(Rr.cpu)}</b>${cpu.busy_percent != null ? cpu.busy_percent.toFixed(0) + ' %' : '—'} <span class="muted">· load ${(cpu.load || []).map(x => x.toFixed(2)).join(' ')}</span></div>`;
    h += `<div><b>CPU temp</b>${cpu.temp_c != null ? cpu.temp_c.toFixed(0) + ' °C' : '—'}</div>`;
  }
  const bat = P('battery');
  if (bat?.present) h += `<div><b>battery</b>${bat.capacity_percent ?? '—'} % · ${esc(bat.status || '')}${bat.ac_online ? ' · AC' : ''}${bat.power_w ? ' · ' + bat.power_w.toFixed(1) + ' W' : ''}</div>`;
  h += `</div>`;
  out.push(h);
  const rp = P('rocm_pids');
  if (rp?.processes?.length) {
    out.push(`<h2 style="margin-top:1rem">GPU-holding processes <span class="sub">rocm-smi --showpids${badge(Rr.rocm_pids)}</span></h2><div class="tablewrap"><table><tr><th>pid</th><th>process</th><th class="num">compute memory</th><th>gpu</th></tr>` +
      rp.processes.slice().sort((a, b) => (b.vram_used || 0) - (a.vram_used || 0)).map(p => `<tr><td>${p.pid}</td><td>${esc(p.name)}</td><td class="num">${fmtBytes(p.vram_used)}</td><td>${esc(p.gpus ?? '')}</td></tr>`).join('') + '</table></div>');
  }
  const dk = P('disk');
  if (dk?.filesystems?.length) {
    out.push(`<h2 style="margin-top:1rem">Disk${badge(Rr.disk)}</h2><div class="tablewrap"><table><tr><th>mount</th><th>fs</th><th class="num">used</th><th class="num">avail</th><th style="width:30%">&nbsp;</th></tr>` +
      dk.filesystems.map(f => `<tr><td>${esc(f.target)} <span class="muted">${esc(f.source)}</span></td><td>${esc(f.fstype)}</td><td class="num">${fmtBytes(f.used)}</td><td class="num">${fmtBytes(f.avail)}</td><td>${bar(f.used, f.size)}</td></tr>`).join('') + '</table></div>');
  }
  $('system').innerHTML = out.join('');
}

// ---------------------------------------------------------------- scheduling
let timer = null;
function stamp() { $('stamp').textContent = state.ts ? new Date(state.ts).toLocaleTimeString() : '—'; }
function start() { clearInterval(timer); timer = setInterval(() => { if (!paused) poll(); }, 1000); poll(); }
document.addEventListener('visibilitychange', () => {
  paused = document.hidden; $('pausedFlag').hidden = !paused;
  if (!paused) poll();
});

// ---------------------------------------------------------------- settings UI
const form = $('settingsForm');
$('settingsBtn').addEventListener('click', () => {
  for (const k of Object.keys(DEFAULTS)) form.elements[k].value = S[k] || '';
  const list = servers();
  $('upstreams').innerHTML = list.length ? list.map(sv => `<dt>${esc(sv.name)}</dt><dd>${esc(sv.url)} — ${sv.ok ? 'healthy' : 'down'}</dd>`).join('') : '<dd class="muted">none reported yet</dd>';
  $('settingsDlg').showModal();
});
$('settingsReset').addEventListener('click', () => { for (const k of Object.keys(DEFAULTS)) form.elements[k].value = DEFAULTS[k]; });
form.addEventListener('submit', () => {
  const s = {}; for (const k of Object.keys(DEFAULTS)) s[k] = form.elements[k].value.trim();
  saveSettings(s); state.all = null; modelsSig = ''; start();
});

start();
</script>
